name: 可锐 HTTPS 与证书异常监测

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: https-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取监测脚本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 验证告警规则
        run: python3 -m unittest -v
      - name: 检查公网 HTTPS 和证书
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud_run.py
